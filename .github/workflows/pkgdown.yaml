# Build the pkgdown site in the gdal-r-python image, which has R, GDAL, the
# GDAL Python bindings, xarray, zarr, h5netcdf, gdalxarray and pkgdown, with
# RETICULATE_PYTHON pointing at its Python. The live articles run there
# against public data, so they show real output.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    container: ghcr.io/hypertidy/gdal-r-python:latest
    # restrict concurrency only for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"
      # The image turns on dask's array query planning, under which
      # xarray's open_mfdataset fails (NotImplementedError from concat's
      # result_type); the articles show released dask's default.
      DASK_ARRAY__QUERY_PLANNING: "False"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Trust the workspace (the container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Python packages the image lacks
        # gcsfs for the ERA5 zarr store on Google Cloud, xvec for vector cubes
        run: uv pip install --python "$RETICULATE_PYTHON" gcsfs xvec

      - name: R dependencies
        # Keep the image's packages, and never let pak apt-install system
        # requirements: Ubuntu's libgdal-dev and libgeos-dev would put a second
        # libgeos_c.so.1 beside the image's, and whichever loads first is the
        # one shapely gets (GEOSSplit_r was missing when Ubuntu's won).
        env:
          PKG_SYSREQS: "false"
        run: Rscript -e 'pak::local_install_deps(dependencies = TRUE, upgrade = FALSE, ask = FALSE)'

      - name: One GEOS for R and Python
        # sf and shapely in one process, as the articles load them
        run: Rscript -e 'library(sf); invisible(reticulate::import("shapely"))'

      - name: Install xrdbi
        run: R CMD INSTALL .

      - name: Build site
        run: Rscript -e 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'

      - name: rsync for the deploy action (the image has none)
        if: github.event_name != 'pull_request'
        run: apt-get update -qq && apt-get install -y --no-install-recommends rsync

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
