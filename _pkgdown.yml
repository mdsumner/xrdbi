url: https://mdsumner.github.io/xrdbi/

template:
  bootstrap: 5

reference:
  - title: Overview
    contents:
      - xrdbi-package
  - title: Connect
    desc: Open a connection to an xarray Dataset and look around it.
    contents:
      - xarray
      - '`dbConnect,XarrayDriver-method`'
      - XarrayConnection-class
  - title: Query
    desc: >
      Python statements, compiled selections, dplyr verbs, and whole
      variables.
    contents:
      - XarrayResult-class
      - xr_query
      - tbl_xarray
      - '`dbReadTable,XarrayConnection,character-method`'
  - title: Render other ways
